<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Straddle Bot — Monitor</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #131722;
    --panel-border: #232838;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #5b8cff;
    --green: #3ecf8e;
    --red: #ff5c5c;
    --gray: #6b7280;
    --amber: #f5a623;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-border: #e3e6ec;
      --text: #1a1d24;
      --muted: #6b7280;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
    max-width: 900px;
    margin-inline: auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .card .label { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .card .value { font-size: 1.15rem; font-weight: 600; margin-top: 2px; }
  section { margin-bottom: 28px; }
  section h2 {
    font-size: 0.95rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 0 0 10px;
  }
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--panel-border);
    margin-bottom: 18px;
    overflow-x: auto;
  }
  .tab-btn {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    padding: 10px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .row {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .row-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge.dir-long { background: rgba(62,207,142,0.15); color: var(--green); }
  .badge.dir-short { background: rgba(255,92,92,0.15); color: var(--red); }
  .badge.reason-tp { background: rgba(62,207,142,0.15); color: var(--green); }
  .badge.reason-sl { background: rgba(255,92,92,0.15); color: var(--red); }
  .badge.reason-liquidation { background: rgba(255,92,92,0.3); color: #ffb3b3; }
  .badge.reason-timeout { background: rgba(139,147,167,0.2); color: var(--muted); }
  .badge.reason-trail { background: rgba(91,140,255,0.15); color: var(--accent); }
  .badge.reason-manual { background: rgba(245,166,35,0.15); color: var(--amber); }
  .badge.reason-orphaned { background: rgba(139,147,167,0.2); color: var(--muted); }
  .badge.wallet-a { background: rgba(91,140,255,0.12); color: var(--accent); }
  .badge.wallet-b { background: rgba(245,166,35,0.15); color: var(--amber); }
  .badge.dry { background: rgba(245,166,35,0.15); color: var(--amber); }
  .badge.live { background: rgba(255,92,92,0.15); color: var(--red); }
  .badge.trail-armed { background: rgba(91,140,255,0.15); color: var(--accent); }
  .badge.trail-touched { background: rgba(245,166,35,0.15); color: var(--amber); }
  .meta { color: var(--muted); font-size: 0.78rem; }
  .pnl-pos { color: var(--green); font-weight: 600; }
  .pnl-neg { color: var(--red); font-weight: 600; }
  .empty { color: var(--muted); font-size: 0.85rem; padding: 20px; text-align: center; }
  .range-switch { display: flex; gap: 6px; margin-bottom: 18px; }
  .range-btn {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
  }
  .range-btn.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .error-box {
    background: rgba(255,92,92,0.1);
    border: 1px solid var(--red);
    color: var(--red);
    padding: 14px;
    border-radius: 10px;
    font-size: 0.85rem;
  }
  #loading { color: var(--muted); padding: 20px; text-align: center; }
  button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="row-top" style="margin-bottom:2px">
    <h1 style="margin:0" id="page-title">Straddle Bot</h1>
    <button onclick="load()">Obnovit</button>
  </div>
  <div class="range-switch" id="bot-switch">
    <button class="range-btn" data-bot="ada">ADA</button>
    <button class="range-btn" data-bot="zec">ZEC</button>
    <button class="range-btn" data-bot="night">NIGHT</button>
  </div>
  <div class="subtitle" id="last-refresh">Nacitavam...</div>

  <div id="loading">Nacitavam data...</div>
  <div id="content" style="display:none">
    <div id="halt-banner" style="display:none; margin-bottom:14px; padding:12px 16px; border-radius:10px; background:rgba(255,92,92,0.12); border:1px solid var(--red); color:var(--red); font-weight:600"></div>
    <div class="grid" id="summary-grid"></div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="open">Otvorene pozicie</button>
      <button class="tab-btn" data-tab="closed">Historia obchodov</button>
      <button class="tab-btn" data-tab="events">Runtime log</button>
      <button class="tab-btn" data-tab="config">Konfiguracia</button>
      <button class="tab-btn" data-tab="charts">Grafy</button>
    </div>

    <div class="tab-panel active" id="tab-open">
      <section style="margin-bottom:20px">
        <h2 id="price-chart-title">Cena (24h) + urovne otvorenych pozicii</h2>
        <div id="price-levels-chart"></div>
        <div id="price-levels-legend" class="meta" style="margin-top:8px"></div>
      </section>
      <div class="row-top" style="margin-bottom:10px">
        <h2 style="margin:0">Otvorene pozicie</h2>
        <div style="display:flex; gap:8px; align-items:center">
          <span id="force-close-status" class="meta"></span>
          <button id="force-close-btn" style="border-color:var(--red); color:var(--red)"
                  onclick="forceCloseAndReset()">Zavriet a resetnut</button>
        </div>
      </div>
      <div id="open-list"></div>
    </div>

    <div class="tab-panel" id="tab-closed">
      <h2>Historia obchodov</h2>
      <div id="closed-list"></div>
    </div>

    <div class="tab-panel" id="tab-events">
      <h2>Runtime log</h2>
      <div id="events-list"></div>
    </div>

    <div class="tab-panel" id="tab-config">
      <h2>Zostatky walletov (Strike, aktualizovane ~1x/min)</h2>
      <div class="grid" id="wallet-balances-grid" style="margin-bottom:24px"></div>
      <h2>Konfiguracia (nacitana z Railway ENV pri poslednom starte bota)</h2>
      <div class="grid" id="config-grid"></div>
      <div class="grid" id="crash-config-grid" style="margin-top:12px"></div>
      <div class="meta" style="margin-top:12px" id="config-footnote"></div>
    </div>

    <div class="tab-panel" id="tab-charts">
      <div class="range-switch" id="range-switch">
        <button class="range-btn" data-range="24h">24h</button>
        <button class="range-btn active" data-range="10d">10 dni</button>
      </div>
      <section style="margin-bottom:20px">
        <h2>Vyvoj kumulativneho PnL</h2>
        <div id="pnl-chart"></div>
      </section>
      <section style="margin-bottom:0">
        <h2>Vyvoj win rate</h2>
        <div id="winrate-chart"></div>
      </section>
    </div>
  </div>
  <div id="error" style="display:none" class="error-box"></div>

<script>
function getToken() {
  const params = new URLSearchParams(window.location.search);
  return params.get("token") || sessionStorage.getItem("dashboard_token") || "";
}

const BOT_META = {
  ada: {
    label: "ADA",
    footnote: "SL/TP zmenene 2026-08-04 z 2%/3.5% na 2%/12% po prehodnoteni na suvislom " +
      "2-rocnom backteste (povodna validacia bola len +$24 net za 86 dni - prilis " +
      "tenka hrana, ktora sa na dlhsom obdobi preklopila do straty). Likvidacny " +
      "vankus ostava nezmeneny (2.58x), zmenilo sa len TP. " +
      "Crash-defense (volatility circuit-breaker) sme vedome NEzapli - na tomto " +
      "uz aj tak sirokom TP skor skodil, nie pomahal.",
  },
  zec: {
    label: "ZEC",
    footnote: "SL/TP=2.75%/12.0% zvolene 2026-08-05 na suvislom 2-rocnom ZECUSDT backteste " +
      "(rovnaka metodika ako ADA revalidacia) - najlepsia kombinacia velkosti aj " +
      "okennej robustnosti (6/9 pozitivnych ~83-dnovych okien), nie len najvyssie cislo " +
      "v grid-e. Crash-defense vedome VYPNUTY - na tomto kandidatovi obratil zisk na " +
      "stratu ($1746 -> -$971 v teste), presny opak efektu na NIGHT bote.",
  },
  night: {
    label: "NIGHT",
    footnote: "SL/TP=4.0%/5.5% (normalny rezim) je najlepsi z pomerne slabeho poľa na ~5 " +
      "mesiacoch dat - ber ako hruby odhad, nie overenu hranu ako pri ADA/ZEC. " +
      "Crash-defense je tu ZAPNUTY defaultne (na rozdiel od ZEC) - Strike-ov margin tier " +
      "pre NIGHT ma len 1.25x likvidacny vankus v normalnom rezime (vs 1.9-2.6x pri " +
      "ADA/ZEC), a down-scalovana simulacia crashu z 10.10.2025 ukazala, ze crash-defense " +
      "tu eliminuje likvidacie a zhruba strojnasobuje PnL.",
  },
};
const DEFAULT_BOT = "ada";

function getBot() {
  const params = new URLSearchParams(window.location.search);
  const fromUrl = params.get("bot");
  if (fromUrl && BOT_META[fromUrl]) return fromUrl;
  const stored = sessionStorage.getItem("dashboard_bot");
  if (stored && BOT_META[stored]) return stored;
  return DEFAULT_BOT;
}

let currentBot = getBot();

function setBot(bot) {
  currentBot = bot;
  sessionStorage.setItem("dashboard_bot", bot);
  const params = new URLSearchParams(window.location.search);
  params.set("bot", bot);
  history.replaceState(null, "", "?" + params.toString());
  document.querySelectorAll("#bot-switch .range-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.bot === bot);
  });
  const meta = BOT_META[bot];
  document.getElementById("page-title").textContent = "Straddle Bot — " + meta.label;
  document.getElementById("price-chart-title").textContent = meta.label + " cena (24h) + urovne otvorenych pozicii";
}

function setupBotSwitch() {
  document.querySelectorAll("#bot-switch .range-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.bot === currentBot) return;
      setBot(btn.dataset.bot);
      load();
    });
  });
  setBot(currentBot);
}

function fmtTime(ms) {
  if (!ms) return "-";
  const d = new Date(Number(ms));
  return d.toLocaleString("sk-SK", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

function escapeHtml(value) {
  if (value == null) return "";
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function fmtPct(v) {
  if (v == null) return "-";
  return (Number(v) * 100).toFixed(3) + "%";
}

function fmtDuration(ms) {
  if (ms == null) return "-";
  const totalMin = Number(ms) / 60000;
  if (totalMin < 60) return totalMin.toFixed(1) + "min";
  const totalHours = totalMin / 60;
  if (totalHours < 24) return totalHours.toFixed(1) + "h";
  const days = Math.floor(totalHours / 24);
  const hours = totalHours - days * 24;
  return `${days}d ${hours.toFixed(1)}h`;
}

function renderSummary(summary) {
  const grid = document.getElementById("summary-grid");
  const items = [
    ["Mod", summary.dryRun === null ? "-" : (summary.dryRun ? "DRY RUN" : "LIVE")],
    ["Otvorene nohy", summary.openCount],
    ["Uzavrete obchody", summary.closedCount],
    ["Win rate", summary.winRate != null ? summary.winRate.toFixed(1) + "%" : "-"],
    ["Kumulativne PnL", "$" + summary.totalPnlUsd.toFixed(4)],
    ["Priemerne trvanie straddle", fmtDuration(summary.avgStraddleDurationMs)],
  ];
  grid.innerHTML = items.map(([label, value]) => `
    <div class="card">
      <div class="label">${label}</div>
      <div class="value">${value}</div>
    </div>
  `).join("");
}

function renderOpen(open) {
  const el = document.getElementById("open-list");
  const forceBtn = document.getElementById("force-close-btn");
  if (forceBtn) forceBtn.disabled = !open.length;
  if (!open.length) {
    el.innerHTML = '<div class="empty">Ziadne otvorene pozicie.</div>';
    return;
  }
  el.innerHTML = open.map(p => {
    let trailBadge = "";
    if (p.tp_armed) {
      trailBadge = `<span class="badge trail-armed">Trailing aktivny - peak ${Number(p.tp_peak).toFixed(6)}</span>`;
    } else if (p.tp_touched) {
      trailBadge = `<span class="badge trail-touched">TP dotknute - caka na potvrdenie</span>`;
    }
    return `
    <div class="row">
      <div class="row-top">
        <div>
          <span class="badge wallet-${p.wallet.toLowerCase()}">Wallet ${p.wallet}</span>
          <span class="badge dir-${p.side}">${p.side.toUpperCase()}</span>
          <span class="badge ${p.dry_run ? 'dry' : 'live'}">${p.dry_run ? 'DRY RUN' : 'LIVE'}</span>
          ${trailBadge}
        </div>
        <span class="meta">otvorene ${fmtTime(p.entry_ts_ms)}</span>
      </div>
      <div class="meta" style="margin-top:6px">
        entry ${p.entry_price} | SL ${Number(p.sl_price).toFixed(6)} | TP ${Number(p.tp_price).toFixed(6)}
        ${p.liq_price != null ? ` | LIQ ${Number(p.liq_price).toFixed(6)}` : ''}
        | notional $${p.notional_usd} | group ${escapeHtml(p.trade_group_id)}
      </div>
    </div>`;
  }).join("");
}

function renderClosed(closed) {
  const el = document.getElementById("closed-list");
  if (!closed.length) {
    el.innerHTML = '<div class="empty">Zatial ziadne uzavrete obchody.</div>';
    return;
  }
  el.innerHTML = closed.map(t => {
    const pnlClass = Number(t.pnl_usd_net) > 0 ? "pnl-pos" : Number(t.pnl_usd_net) < 0 ? "pnl-neg" : "";
    return `
    <div class="row">
      <div class="row-top">
        <div>
          <span class="badge wallet-${t.wallet.toLowerCase()}">Wallet ${t.wallet}</span>
          <span class="badge dir-${t.side}">${t.side.toUpperCase()}</span>
          <span class="badge reason-${(t.exit_reason || '').toLowerCase()}">${escapeHtml(t.exit_reason)}</span>
          <span class="badge ${t.dry_run ? 'dry' : 'live'}">${t.dry_run ? 'DRY RUN' : 'LIVE'}</span>
        </div>
        <span class="meta">${fmtTime(t.exit_ts_ms)}</span>
      </div>
      <div class="meta" style="margin-top:6px">
        entry ${t.entry_price} &rarr; exit ${t.exit_price}
        | raw ${fmtPct(t.pnl_pct_raw)} | fee ${fmtPct(t.fee_pct)} | net ${fmtPct(t.pnl_pct_net)}
        ${Number(t.funding_usd) ? ` | funding $${Number(t.funding_usd).toFixed(4)}` : ""}
        | trvanie ${fmtDuration(Number(t.exit_ts_ms) - Number(t.entry_ts_ms))}
      </div>
      <div style="margin-top:6px">PnL: <span class="${pnlClass}">$${Number(t.pnl_usd_net).toFixed(4)}</span></div>
    </div>`;
  }).join("");
}

function renderEvents(events) {
  const el = document.getElementById("events-list");
  if (!events.length) {
    el.innerHTML = '<div class="empty">Zatial ziadne udalosti.</div>';
    return;
  }
  el.innerHTML = events.map(e => `
    <div class="row">
      <div class="row-top">
        <span class="badge" style="background:rgba(91,140,255,0.12);color:var(--accent)">${escapeHtml(e.event_type)}</span>
        <span class="meta">${fmtTime(e.ts_ms)}</span>
      </div>
      <div class="meta" style="margin-top:6px">${escapeHtml(e.message)}</div>
    </div>
  `).join("");
}

function renderHaltBanner(halt) {
  const el = document.getElementById("halt-banner");
  if (!halt || !halt.halted) {
    el.style.display = "none";
    return;
  }
  el.style.display = "block";
  el.innerHTML = `ZASTAVENE (${fmtTime(Number(halt.halted_ts_ms))}): ${escapeHtml(halt.reason || "")}`
    + `<br><span style="font-weight:400">Bot neotvara nove pozicie. Obnov cez "Zavriet a resetnut" v tabe Otvorene pozicie.</span>`;
}

function renderWalletBalances(balances) {
  const grid = document.getElementById("wallet-balances-grid");
  if (!balances || !balances.length) {
    grid.innerHTML = '<div class="empty">Zostatky sa zobrazia po prvom live cykle (bot este bezal len v dry-rune, alebo este nestihol prvy fetch).</div>';
    return;
  }
  const walletLabel = { MAIN: "Main wallet", A: "Leg A", B: "Leg B" };
  grid.innerHTML = balances.map(b => {
    const upnl = Number(b.unrealized_pnl_usd);
    const upnlClass = upnl > 0 ? "pnl-pos" : upnl < 0 ? "pnl-neg" : "";
    return `
    <div class="card">
      <div class="label">${escapeHtml(walletLabel[b.wallet] || ("Wallet " + b.wallet))}</div>
      <div class="value">$${Number(b.wallet_balance_usd).toFixed(2)}</div>
      <div class="meta" style="margin-top:4px">
        volne $${Number(b.available_balance_usd).toFixed(2)}
        | nerealizovana <span class="${upnlClass}">$${upnl.toFixed(2)}</span>
      </div>
      <div class="meta" style="margin-top:2px">${fmtTime(Number(b.updated_ts_ms))}</div>
    </div>`;
  }).join("");
}

function renderConfig(cfg) {
  const grid = document.getElementById("config-grid");
  if (!cfg) {
    grid.innerHTML = '<div class="empty">Config sa zobrazi po prvom starte bota.</div>';
    return;
  }
  const items = [
    ["Mod", cfg.dry_run ? "DRY RUN" : "LIVE"],
    ["Symbol", cfg.strike_symbol],
    ["SL %", cfg.sl_pct.toFixed(2) + "%"],
    ["TP %", cfg.tp_pct.toFixed(2) + "%"],
    ["Notional / noha", "$" + cfg.position_notional_usd],
    ["Leverage", cfg.leverage + "x"],
    ["Margin mode", cfg.margin_mode],
    ["Max drzanie", cfg.max_hold_minutes > 0 ? cfg.max_hold_minutes + " min" : "bez limitu (SL/TP)"],
    ["Re-entry", cfg.re_entry_policy],
    ["Trailing TP", cfg.trailing_tp_enabled ? "zapnuty" : "vypnuty"],
    ["TP potvrdenie", cfg.tp_confirm_pct.toFixed(2) + "% nad TP"],
    ["TP trailing", cfg.tp_trail_pct.toFixed(2) + "% od peaku"],
    ["Taker fee (base)", cfg.taker_fee_base_pct.toFixed(3) + "%"],
    ["Maker fee (rebate)", cfg.maker_fee_pct.toFixed(3) + "%"],
    ["STRIKE drzane (master wallet)", cfg.wallet_a_strike_held.toLocaleString()],
    ["Zlava / taker (obe nohy)", cfg.wallet_a_strike_discount_pct.toFixed(1) + "% / " + cfg.wallet_a_effective_taker_fee_pct.toFixed(3) + "%"],
    ["Maintenance margin", cfg.strike_mmr_pct.toFixed(2) + "%"],
    ["Likvidacny poplatok", cfg.liquidation_fee_pct.toFixed(2) + "%"],
  ];
  grid.innerHTML = items.map(([label, value]) => `
    <div class="card">
      <div class="label">${escapeHtml(label)}</div>
      <div class="value">${escapeHtml(String(value))}</div>
    </div>
  `).join("");

  const crashGrid = document.getElementById("crash-config-grid");
  if (cfg.crash_defense_enabled === undefined) {
    crashGrid.innerHTML = "";
  } else {
    const crashItems = [
      ["Crash-defense", cfg.crash_defense_enabled ? "zapnuty" : "vypnuty"],
      ["Detekcia okno / vstup / vystup", cfg.crash_vol_window_min + "min / " + cfg.crash_entry_pct.toFixed(1) + "% / " + cfg.crash_exit_pct.toFixed(1) + "%"],
      ["Potvrdenie pokoja", cfg.crash_confirm_calm_min + "min"],
      ["Crash leverage / SL / TP", cfg.crash_leverage + "x / " + cfg.crash_sl_pct.toFixed(1) + "% / " + cfg.crash_tp_pct.toFixed(1) + "%"],
      ["Smerove okno / min. pohyb", cfg.crash_dir_window_min + "min / " + cfg.crash_dir_min_move_pct.toFixed(1) + "%"],
    ];
    crashGrid.innerHTML = crashItems.map(([label, value]) => `
      <div class="card">
        <div class="label">${escapeHtml(label)}</div>
        <div class="value">${escapeHtml(String(value))}</div>
      </div>
    `).join("");
  }

  document.getElementById("config-footnote").textContent =
    (BOT_META[currentBot] && BOT_META[currentBot].footnote) || "";
}

let allClosed = [];
let currentRange = "10d";
const RANGE_MS = { "24h": 24 * 3600 * 1000, "10d": 10 * 24 * 3600 * 1000 };
const BUCKET_MS = { "24h": 3600 * 1000, "10d": 24 * 3600 * 1000 };

function renderLineChart(containerId, points, { color = "var(--accent)", yFmt = (v) => v.toFixed(2), zeroLine = false } = {}) {
  const el = document.getElementById(containerId);
  if (!points.length) {
    el.innerHTML = '<div class="empty">Ziadne obchody v tomto obdobi.</div>';
    return;
  }
  if (points.length === 1) {
    points = [points[0], { x: points[0].x + 1, y: points[0].y }];
  }

  const width = 860, height = 200, padL = 55, padR = 12, padT = 12, padB = 26;
  const innerW = width - padL - padR, innerH = height - padT - padB;

  const xs = points.map(p => p.x);
  const ys = points.map(p => p.y);
  const minT = Math.min(...xs), maxT = Math.max(...xs);
  let minY = Math.min(...ys), maxY = Math.max(...ys);
  if (zeroLine) { minY = Math.min(minY, 0); maxY = Math.max(maxY, 0); }
  const padY = (maxY - minY) * 0.12 || Math.abs(maxY) * 0.05 || 1;
  const yMin = minY - padY, yMax = maxY + padY;

  const xScale = t => padL + ((t - minT) / (maxT - minT || 1)) * innerW;
  const yScale = v => padT + innerH - ((v - yMin) / (yMax - yMin || 1)) * innerH;

  const linePoints = points.map(p => `${xScale(p.x)},${yScale(p.y)}`).join(" ");
  const zero = zeroLine && yMin < 0 && yMax > 0
    ? `<line x1="${padL}" y1="${yScale(0)}" x2="${width - padR}" y2="${yScale(0)}" stroke="var(--panel-border)" stroke-dasharray="4 3" />`
    : "";

  const tickCount = 5;
  const xTicks = Array.from({ length: tickCount }, (_, i) => minT + (maxT - minT) * (i / (tickCount - 1)));
  const xLabels = xTicks.map(t => {
    const label = new Date(t).toLocaleString("sk-SK", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    return `<text x="${xScale(t)}" y="${height - 6}" font-size="9" fill="var(--muted)" text-anchor="middle">${label}</text>`;
  }).join("");

  el.innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block">
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${height - padB}" stroke="var(--panel-border)" />
      <line x1="${padL}" y1="${height - padB}" x2="${width - padR}" y2="${height - padB}" stroke="var(--panel-border)" />
      ${zero}
      <polyline points="${linePoints}" fill="none" stroke="${color}" stroke-width="1.8" />
      <text x="${padL - 6}" y="${yScale(yMax) + 4}" font-size="10" fill="var(--muted)" text-anchor="end">${yFmt(yMax)}</text>
      <text x="${padL - 6}" y="${yScale(yMin) + 4}" font-size="10" fill="var(--muted)" text-anchor="end">${yFmt(yMin)}</text>
      ${xLabels}
    </svg>
  `;
}

function computePnlSeries(closedInRange) {
  let running = 0;
  return closedInRange.map(t => {
    running += Number(t.pnl_usd_net || 0);
    return { x: Number(t.exit_ts_ms), y: running };
  });
}

function computeWinRateSeries(closedInRange, bucketMs) {
  const buckets = new Map();
  for (const t of closedInRange) {
    const bucketStart = Math.floor(Number(t.exit_ts_ms) / bucketMs) * bucketMs;
    if (!buckets.has(bucketStart)) buckets.set(bucketStart, { wins: 0, total: 0 });
    const b = buckets.get(bucketStart);
    b.total += 1;
    if (Number(t.pnl_usd_net) > 0) b.wins += 1;
  }
  return Array.from(buckets.entries())
    .sort((a, b) => a[0] - b[0])
    .map(([x, b]) => ({ x, y: (b.wins / b.total) * 100 }));
}

function renderCharts() {
  const rangeMs = RANGE_MS[currentRange];
  const bucketMs = BUCKET_MS[currentRange];
  const cutoff = Date.now() - rangeMs;
  const inRange = allClosed
    .filter(t => Number(t.exit_ts_ms) >= cutoff)
    .sort((a, b) => Number(a.exit_ts_ms) - Number(b.exit_ts_ms));

  renderLineChart("pnl-chart", computePnlSeries(inRange), {
    color: "var(--accent)", yFmt: v => "$" + v.toFixed(2), zeroLine: true,
  });
  renderLineChart("winrate-chart", computeWinRateSeries(inRange, bucketMs), {
    color: "var(--green)", yFmt: v => v.toFixed(0) + "%",
  });
}

const WALLET_LINE_COLOR = { A: "#5b8cff", B: "#f5a623" };

function renderPriceLevelsChart(priceHistory, openPositions) {
  const el = document.getElementById("price-levels-chart");
  const legendEl = document.getElementById("price-levels-legend");
  const points = priceHistory
    .map(p => ({ x: Number(p.ts_ms), y: Number(p.price) }))
    .sort((a, b) => a.x - b.x);

  if (!points.length) {
    el.innerHTML = '<div class="empty">Zatial ziadne cenove data (zbierajú sa priebežne, ~1/min).</div>';
    legendEl.innerHTML = "";
    return;
  }

  const width = 860, height = 260, padL = 60, padR = 70, padT = 12, padB = 26;
  const innerW = width - padL - padR, innerH = height - padT - padB;

  const minT = points[0].x, maxT = points[points.length - 1].x;
  const levels = [];
  for (const p of openPositions) {
    levels.push({ wallet: p.wallet, type: "SL", value: Number(p.sl_price) });
    levels.push({ wallet: p.wallet, type: "TP", value: Number(p.tp_price) });
  }

  const allY = points.map(p => p.y).concat(levels.map(l => l.value));
  let minY = Math.min(...allY), maxY = Math.max(...allY);
  const padY = (maxY - minY) * 0.08 || Math.abs(maxY) * 0.01 || 1;
  minY -= padY; maxY += padY;

  const xScale = t => padL + ((t - minT) / (maxT - minT || 1)) * innerW;
  const yScale = v => padT + innerH - ((v - minY) / (maxY - minY || 1)) * innerH;

  const pricePolyline = points.map(p => `${xScale(p.x)},${yScale(p.y)}`).join(" ");

  const levelLines = levels.map(l => {
    const color = WALLET_LINE_COLOR[l.wallet] || "var(--muted)";
    const dash = l.type === "SL" ? "6 4" : "0";
    const y = yScale(l.value);
    return `
      <line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="${color}"
            stroke-width="1.4" stroke-dasharray="${dash}" opacity="0.85" />
      <text x="${width - padR + 4}" y="${y + 3}" font-size="9.5" fill="${color}">
        ${escapeHtml(l.wallet)} ${escapeHtml(l.type)} ${l.value.toFixed(4)}
      </text>`;
  }).join("");

  const tickCount = 5;
  const xTicks = Array.from({ length: tickCount }, (_, i) => minT + (maxT - minT) * (i / (tickCount - 1)));
  const xLabels = xTicks.map(t => {
    const label = new Date(t).toLocaleString("sk-SK", { hour: "2-digit", minute: "2-digit" });
    return `<text x="${xScale(t)}" y="${height - 6}" font-size="9" fill="var(--muted)" text-anchor="middle">${label}</text>`;
  }).join("");

  el.innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block">
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${height - padB}" stroke="var(--panel-border)" />
      <line x1="${padL}" y1="${height - padB}" x2="${width - padR}" y2="${height - padB}" stroke="var(--panel-border)" />
      <polyline points="${pricePolyline}" fill="none" stroke="var(--text)" stroke-width="1.6" />
      ${levelLines}
      <text x="${padL - 6}" y="${yScale(maxY - padY) + 4}" font-size="10" fill="var(--muted)" text-anchor="end">${(maxY - padY).toFixed(4)}</text>
      <text x="${padL - 6}" y="${yScale(minY + padY) + 4}" font-size="10" fill="var(--muted)" text-anchor="end">${(minY + padY).toFixed(4)}</text>
      ${xLabels}
    </svg>
  `;

  if (!openPositions.length) {
    legendEl.textContent = "Ciara = ADA cena. Ziadne otvorene pozicie, ziadne TP/SL urovne na zobrazenie.";
  } else {
    legendEl.innerHTML = "Plna ciara = TP, prerusovana = SL, farba = wallet " +
      Object.entries(WALLET_LINE_COLOR)
        .map(([w, c]) => `<span style="color:${c}">&#9632; ${w}</span>`)
        .join(" &nbsp; ");
  }
}

function setupRangeSwitch() {
  const btns = document.querySelectorAll(".range-btn");
  btns.forEach(btn => {
    btn.addEventListener("click", () => {
      btns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentRange = btn.dataset.range;
      renderCharts();
    });
  });
}

async function forceCloseAndReset() {
  const confirmed = window.confirm(
    "Naozaj zavriet VSETKY otvorene pozicie za aktualnu cenu a hned otvorit novy straddle par? " +
    "Toto sa neda vratit spat."
  );
  if (!confirmed) return;

  const token = getToken();
  const btn = document.getElementById("force-close-btn");
  const status = document.getElementById("force-close-status");
  btn.disabled = true;
  status.textContent = "Odosielam...";

  try {
    const resp = await fetch(`/api/force-close?token=${encodeURIComponent(token)}&bot=${currentBot}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, bot: currentBot }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || "Neznama chyba");
    status.textContent = "Prikaz odoslany - bot ho vykona do ~5s.";
    setTimeout(load, 7000);
  } catch (e) {
    status.textContent = "Chyba: " + e.message;
    btn.disabled = false;
  }
}

function setupTabs() {
  const btns = document.querySelectorAll(".tab-btn");
  btns.forEach(btn => {
    btn.addEventListener("click", () => {
      btns.forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
    });
  });
}

async function load() {
  const token = getToken();
  if (token) sessionStorage.setItem("dashboard_token", token);

  document.getElementById("loading").style.display = "block";
  document.getElementById("content").style.display = "none";
  document.getElementById("error").style.display = "none";

  try {
    const resp = await fetch(`/api/status?token=${encodeURIComponent(token)}&bot=${currentBot}`);
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || "Neznama chyba");

    renderSummary(data.summary);
    renderOpen(data.open || []);
    renderClosed(data.closed || []);
    renderEvents(data.events || []);
    renderConfig(data.config || null);
    renderWalletBalances(data.walletBalances || []);
    renderHaltBanner(data.halt || null);
    renderPriceLevelsChart(data.priceHistory || [], data.open || []);
    allClosed = data.closed || [];
    renderCharts();

    document.getElementById("last-refresh").textContent =
      "Aktualizovane " + new Date().toLocaleTimeString("sk-SK");
    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
  } catch (e) {
    document.getElementById("loading").style.display = "none";
    const errEl = document.getElementById("error");
    errEl.textContent = "Chyba: " + e.message;
    errEl.style.display = "block";
  }
}

setupTabs();
setupRangeSwitch();
setupBotSwitch();
load();
</script>
